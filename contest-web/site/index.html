<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="ARMusic 桌面播放器浏览器演示">
  <title>ARMusic · 作品试听</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="catalog.js"></script>
  <script defer src="home.js"></script>
</head>
<body>
<header class="titlebar">
  <a class="brand" href="index.html" aria-label="ARMusic 首页">
    <span class="brand-mark" aria-hidden="true">A</span>
    <strong>ARMusic</strong>
  </a>
  <div class="transport">
    <div class="tb-track">
      <img id="tb-cover" alt="" width="40" height="40">
      <span class="tb-meta"><strong id="tb-title">未选择曲目</strong><small id="tb-sub">从海报或选段开始</small></span>
    </div>
    <label class="volume" title="音量"><span aria-hidden="true">♪</span><input id="volume" type="range" aria-label="音量" min="0" max="1" step="0.01" value="0.72"></label>
    <div class="transport-controls">
      <button id="prev" type="button" aria-label="上一首" title="上一首">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M7 5v14M19 6.5 9.5 12 19 17.5Z" fill="currentColor"></path></svg>
      </button>
      <button id="play-toggle" type="button" aria-label="播放" title="播放">
        <svg class="icon-play" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M8 5.5v13l10-6.5Z" fill="currentColor"></path></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" hidden><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z" fill="currentColor"></path></svg>
      </button>
      <button id="next" type="button" aria-label="下一首" title="下一首">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M17 5v14M5 6.5 14.5 12 5 17.5Z" fill="currentColor"></path></svg>
      </button>
    </div>
    <div class="seek-wrap">
      <time id="time-current">0:00</time>
      <input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放进度">
      <time id="time-total">0:00</time>
    </div>
  </div>
</header>

<div class="app-shell">
  <aside class="sidebar" aria-label="主导航">
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="m15 15 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <input id="search" type="search" placeholder="搜索曲目或作品" aria-label="搜索曲目或作品" autocomplete="off">
    </div>
    <p class="nav-caption">浏览</p>
    <nav class="nav" aria-label="页面导航">
      <button class="nav-button is-active" type="button" data-nav="home" aria-current="page">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path></svg>
        <span>首页</span>
      </button>
      <button class="nav-button" type="button" data-nav="recent">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"></circle><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path></svg>
        <span>最近播放</span>
      </button>
      <button class="nav-button" type="button" data-nav="works">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"></rect></svg>
        <span>按作品</span>
      </button>
    </nav>
    <div class="library-note">
      <span>本地示例曲库</span>
      <p><strong id="rail-track-count">0</strong> 首曲目 · <strong id="rail-work-count">0</strong> 部作品</p>
    </div>
    <button class="help" id="help" type="button" aria-controls="intro" aria-expanded="true" aria-label="使用提示" title="使用提示">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"></circle><path d="M9.7 9.2a2.5 2.5 0 1 1 3.8 2.2c-.9.6-1.5 1-1.5 2.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path><circle cx="12" cy="17" r="1" fill="currentColor"></circle></svg>
      <span>使用提示</span>
    </button>
  </aside>

  <main class="content">
    <section class="intro" id="intro" aria-label="使用提示">
      <p><strong>试听提示</strong> 点作品海报开始播放；在版本栏切换编曲时，播放进度会保留。</p>
      <button id="dismiss" type="button">知道了</button>
    </section>

    <section class="featured" id="featured" aria-labelledby="featured-title">
      <div class="featured__wash" aria-hidden="true"><img id="featured-wash" alt=""></div>
      <div class="featured__copy">
        <span class="eyebrow">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
          推荐
        </span>
        <h1 id="featured-title">载入中</h1>
        <p class="featured-sub" id="featured-sub"></p>
        <div class="featured-meta" id="featured-meta"></div>
        <div class="featured-actions">
          <button class="featured-play" id="featured-play" type="button" aria-label="播放选段">
            <svg class="icon-play" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M8 5.5v13l10-6.5Z" fill="currentColor"></path></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" hidden><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z" fill="currentColor"></path></svg>
            <span class="label">播放</span>
          </button>
        </div>
      </div>
      <div class="featured__art"><img id="featured-cover" alt=""></div>
      <div class="featured__rail">
        <span class="rail-title">试听选段</span>
        <div class="picks" id="picks" role="group" aria-label="试听选段"></div>
      </div>
    </section>

    <section class="stats" aria-label="曲库概览">
      <article><span>曲目</span><strong id="stat-tracks">0</strong><small>首</small></article>
      <article><span>作品</span><strong id="stat-works">0</strong><small>部</small></article>
      <article><span>同曲版本</span><strong id="stat-versions">0</strong><small>个</small></article>
    </section>

    <div class="library-stage">
      <section class="shelf shelf--recent" id="recent" aria-labelledby="recent-title">
        <div class="shelf-head"><div><h2 id="recent-title">最近播放</h2><p>按最后播放时间排列</p></div></div>
        <div class="recent-grid" id="recent-grid"></div>
        <p class="shelf-empty" id="recent-empty" hidden>没有匹配的曲目</p>
      </section>
      <section class="shelf shelf--works" id="works" aria-labelledby="works-title">
        <div class="shelf-head"><div><h2 id="works-title">按作品</h2><p>同一部作品的曲目与版本</p></div></div>
        <div id="wall" aria-label="选择作品"></div>
        <p class="shelf-empty" id="works-empty" hidden>没有匹配的作品</p>
      </section>
    </div>
  </main>

  <aside class="inspector" aria-labelledby="current">
    <div class="inspector__wash" aria-hidden="true"><img id="inspector-wash" alt=""></div>
    <header class="inspector-head"><span>正在播放</span><i aria-hidden="true"></i></header>
    <div class="inspector-art"><img id="inspector-cover" alt=""></div>
    <div class="inspector-title">
      <h2 id="current" tabindex="-1">未选择曲目</h2>
      <p id="work-name"></p>
    </div>
    <div class="version-block">
      <div class="version-head"><span>同曲版本</span><span id="version-count"></span></div>
      <div id="versions" role="group" aria-label="选择试听版本"></div>
    </div>
    <p class="inspector-desc" id="description"></p>
    <span id="status" role="status" aria-live="polite"></span>
    <audio id="audio" preload="metadata" hidden></audio>
  </aside>
</div>
</body>
</html>
